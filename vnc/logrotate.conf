# TigerVNC 会话日志轮转规则 —— 放到 ~/.vnc/logrotate.conf
#
# 由用户级定时器 vnc-log-rotate.timer 每小时执行一次。
#
# ~/.vnc/<主机>:<端口>.log 记录了 Xvnc 以及 xstartup 里所有进程的
# stdout/stderr，话痨客户端能让它无限增长（本机曾达 1.4 GB）。
#
# copytruncate：日志 fd 在整个会话期间被众多进程持有，不能靠 rename 换文件。
/home/user/.vnc/*.log {
    hourly
    maxsize 50M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
